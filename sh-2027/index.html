<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>202703上海家族遊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: one phone column; whitewashed walls (粉牆) with slate roof-tile eaves (黛瓦) above each day, cinnabar for times and meeting points */
:root{
  --bg:#eceeec; --paper:#fbfbfa; --ink:#23292e; --muted:#5b646c;
  --dai:#3a4d5c; --cinnabar:#a3413a; --moss:#4b6e62; --line:#d4d9db; --chip:#e1e5e7;
  --f-latin:"Cormorant Garamond","Didot","Times New Roman",serif;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111417; --paper:#191e22; --ink:#e6e9ec; --muted:#9ca6ae;
  --dai:#93b1c6; --cinnabar:#e2877c; --moss:#86b6a5; --line:#2b3238; --chip:#222930; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111417; --paper:#191e22; --ink:#e6e9ec; --muted:#9ca6ae;
  --dai:#93b1c6; --cinnabar:#e2877c; --moss:#86b6a5; --line:#2b3238; --chip:#222930; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.3;margin:0}
h2{font-size:1.5rem;color:var(--dai);margin-block:40px 14px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
h3{font-size:1.12rem}
h3.sub{margin-top:20px}
a{color:var(--dai)}
:focus-visible{outline:3px solid var(--cinnabar);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.lat{font-family:var(--f-latin);letter-spacing:.04em}

/* roof-tile eave: rows of half-round tile ends */
.roof{height:22px;margin-bottom:18px;
  background:
    radial-gradient(circle at 50% 100%,var(--dai) 0 9px,transparent 9.5px) 0 0/22px 11px repeat-x,
    linear-gradient(var(--dai),var(--dai)) 0 11px/100% 4px no-repeat,
    radial-gradient(circle at 50% 100%,var(--dai) 0 6px,transparent 6.5px) 11px 15px/22px 7px repeat-x}

/* lock */
.lock{min-height:70vh;display:grid;place-items:center}
.lockbox{width:100%;max-width:380px;background:var(--paper);border:1px solid var(--line);padding:0 22px 26px;display:grid;gap:14px;text-align:center;box-sizing:border-box}
.lockbox .roof{margin:0 -22px 6px}
.lockbox .seal{font-family:var(--f-display);font-size:2.2rem;color:var(--dai);font-weight:900;letter-spacing:.12em}
.lockbox label{font-size:1rem;color:var(--muted)}
.lockbox input{font-size:1.15rem;padding:12px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink);text-align:center;width:100%;box-sizing:border-box}
.lockbox button{font-size:1.05rem;padding:12px;border:0;border-radius:3px;background:var(--dai);color:var(--paper);font-weight:700;cursor:pointer}
.err{color:var(--cinnabar);font-size:.95rem;min-height:1.4em;margin:0}

/* hero */
.hero{padding-block:8px 4px}
.eyebrow{margin:0;color:var(--muted);letter-spacing:.1em;font-size:.9rem}
.hero h1{font-size:2.9rem;font-weight:900}
.hero h1 span{display:block;font-size:1.2rem;color:var(--moss);font-weight:600;margin-top:2px}
.dates{margin:6px 0 0;font-size:1.1rem}
.dates .lat{font-size:1.6rem;color:var(--cinnabar)}
.count{margin:4px 0 0;color:var(--moss);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;z-index:5}
.tabs a{text-decoration:none;color:var(--ink);background:var(--chip);padding:5px 13px;border-radius:999px;font-size:.95rem}
.tabs a:hover{background:var(--line)}

.rules{background:var(--paper);border:1px solid var(--line);padding:4px 18px 12px;margin-top:18px}
.rules h2{margin-block:14px 6px;font-size:1.2rem}
.rules h2::after{display:none}
.rules ul{margin:0;padding-left:1.2em;display:grid;gap:4px}

/* day cards: a white wall under a tile eave */
.day{background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--dai);padding:16px 18px 18px;margin-bottom:16px}
.dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dnum{font-size:1.8rem;color:var(--cinnabar)}
.dow{color:var(--muted)}
.slots{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.slots li{display:grid;grid-template-columns:3em 1fr;gap:10px}
.slots li>div{min-width:0}
.t{font-weight:700;color:var(--moss);font-size:.95rem}
.nav{display:inline-block;margin-left:8px;font-size:.8rem;font-weight:700;border:1px solid var(--dai);border-radius:999px;padding:0 10px;text-decoration:none;white-space:nowrap}
.why{margin:12px 0 0;color:var(--muted);font-size:.94rem}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px}
.lane{min-width:0;background:var(--bg);padding:10px 14px}
.lane p{margin:0}
.who{font-weight:700;color:var(--moss);font-size:.95rem}
.meet{margin:12px 0 0;color:var(--cinnabar);font-size:1.08rem}

.photo{margin:12px -18px 0;}
.photo img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;max-width:100%;background:var(--chip)}
.photo figcaption{font-size:.78rem;color:var(--muted);padding:4px 18px 0}
.photo figcaption a{color:var(--muted)}
.note{color:var(--muted);font-size:.9rem;margin:8px 0 0}
.list{margin:0;padding-left:1.2em;display:grid;gap:6px}
blockquote.card{margin:8px 0 0;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--cinnabar);padding:14px 16px;font-size:1.3rem;line-height:1.8}
.stays{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.stay{background:var(--paper);border:1px solid var(--line);padding:14px 16px;min-width:0}
.stay p{margin:4px 0 0}
.sn{color:var(--cinnabar);font-size:1.2rem;margin:0!important}
.tablewrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;background:var(--paper);font-size:.98rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
.tbl th{color:var(--muted);font-weight:500}
.pill{font-size:.8rem;padding:1px 10px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--moss);color:var(--paper)}
@media (max-width:480px){.hero h1{font-size:2.3rem}body{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <div class="lock" id="lock">
    <form class="lockbox" id="form">
      <div class="roof" aria-hidden="true"></div>
      <div class="seal">上海・蘇州</div>
      <label for="pw">請輸入密碼查看行程</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus>
      <button type="submit">打開行程</button>
      <p class="err" id="err" aria-live="polite"></p>
    </form>
  </div>
  <main id="app" hidden></main>
</div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.ct));
  return new TextDecoder().decode(pt);
}
function countdown(){
  const el=document.getElementById("count"); if(!el) return;
  const now=new Date(), dep=new Date("2027-03-28T00:00:00+08:00"), end=new Date("2027-04-04T00:00:00+08:00");
  const days=Math.ceil((dep-now)/86400000);
  el.textContent= now<dep ? `還有 ${days} 天出發` : now<end ? "旅途中，玩得開心" : "已經回到家了";
}
function show(html){
  document.getElementById("app").innerHTML=html;
  document.getElementById("lock").hidden=true;
  document.getElementById("app").hidden=false;
  window.scrollTo(0,0);
  document.querySelectorAll("#app table.tbl").forEach(t=>{const w=document.createElement("div");w.className="tablewrap";t.before(w);w.append(t)});
  countdown();
}
document.getElementById("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const pw=document.getElementById("pw").value.trim(), err=document.getElementById("err");
  err.textContent="解鎖中…";
