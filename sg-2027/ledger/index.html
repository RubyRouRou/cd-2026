const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct)));
}
function show(html){
 document.open();
 document.write('<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body>'+html+'</body></html>');
 document.close();
}
document.getElementById("f").addEventListener("submit",async e=>{
 e.preventDefault();const pw=document.getElementById("pw").value.trim(),err=document.getElementById("err");
 err.textContent="解鎖中…";
 try{const html=await unlock(pw);try{localStorage.setItem("sgpw",JSON.stringify({pw,exp:Date.now()+7*86400000}))}catch(_){}show(html);}
 catch(_){err.textContent="密碼不對，請再試一次（注意大小寫與減號）";}
});
(async()=>{
 let saved=null;try{saved=JSON.parse(localStorage.getItem("sgpw")||"null")}catch(_){}
 if(!saved||!saved.pw||!(saved.exp>Date.now())){try{localStorage.removeItem("sgpw")}catch(_){}return;}
 try{show(await unlock(saved.pw));}catch(_){try{localStorage.removeItem("sgpw")}catch(_){}}
})();
</script>
