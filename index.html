<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>成都五日行</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one column, big type for an elder reader; day cards read like tea-house menu slips */
:root{
  --bg:#f3f1ea; --paper:#fffdf8; --ink:#22231f; --muted:#5f6158;
  --pepper:#8e2a2a; --bamboo:#3f6b4a; --line:#d9d4c6; --chip:#ece6d6;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17181a; --paper:#1f2123; --ink:#ece9e1; --muted:#a8a69c;
  --pepper:#e07a6a; --bamboo:#8cc39a; --line:#34373a; --chip:#2a2d2f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17181a; --paper:#1f2123; --ink:#ece9e1; --muted:#a8a69c;
  --pepper:#e07a6a; --bamboo:#8cc39a; --line:#34373a; --chip:#2a2d2f; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h2{font-size:1.6rem;color:var(--pepper);margin-block:40px 16px;padding-bottom:6px;border-bottom:2px solid var(--pepper)}
h3{font-size:1.15rem}
a{color:var(--bamboo)}
:focus-visible{outline:3px solid var(--bamboo);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* lock screen */
.lock{min-height:70vh;display:grid;place-items:center}
.lockbox{width:100%;max-width:380px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:28px 22px;display:grid;gap:14px;text-align:center}
.lockbox .seal{font-family:var(--f-display);font-size:2.6rem;color:var(--pepper);font-weight:900;letter-spacing:.1em}
.lockbox label{font-size:1rem;color:var(--muted)}
.lockbox input{font-size:1.2rem;padding:12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);text-align:center;width:100%;box-sizing:border-box}
.lockbox button{font-size:1.1rem;padding:12px;border:0;border-radius:4px;background:var(--pepper);color:var(--paper);font-weight:700;cursor:pointer}
.err{color:var(--pepper);font-size:.95rem;min-height:1.4em;margin:0}

/* content */
.hero{padding-block:16px 8px}
.eyebrow{margin:0;color:var(--muted);letter-spacing:.12em;font-size:.9rem}
.hero h1{font-size:3.2rem;font-weight:900;color:var(--pepper)}
.hero h1 span{font-size:1.3rem;color:var(--ink);font-weight:600;margin-left:.5em}
.dates{margin:4px 0 0;font-size:1.2rem;font-weight:500}
.count{margin:6px 0 0;color:var(--bamboo);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;z-index:5}
.tabs a{text-decoration:none;color:var(--ink);background:var(--chip);padding:6px 14px;border-radius:999px;font-size:.95rem}
.rules{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--bamboo);padding:4px 18px 8px;margin-top:20px}
.rules h2{border:0;margin-block:14px 4px;font-size:1.25rem;color:var(--bamboo)}
.rules ul{margin:0;padding-left:1.2em}
.day{background:var(--paper);border:1px solid var(--line);padding:18px;margin-bottom:16px}
.dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px dashed var(--line);padding-bottom:8px}
.dnum{font-family:var(--f-display);font-weight:900;font-size:1.8rem;color:var(--pepper)}
.dow{color:var(--muted)}
.slots{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.slots li{display:grid;grid-template-columns:3.2em 1fr;gap:10px}
.slots li>div{min-width:0}
.t{font-weight:700;color:var(--bamboo)}
.nav{display:inline-block;margin-left:8px;font-size:.85rem;font-weight:700;border:1px solid var(--bamboo);border-radius:999px;padding:1px 10px;text-decoration:none;white-space:nowrap}
.why{margin:12px 0 0;color:var(--muted);font-size:.95rem}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--paper);font-size:1rem}
th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500}
.note{color:var(--muted);font-size:.9rem;margin:8px 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:16px}
.card{background:var(--paper);border:1px solid var(--line);padding:16px;min-width:0}
.card p,.card ul{margin:8px 0 0}
.card ul{padding-left:1.1em}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.two>div{min-width:0}
.check{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.check li{padding-left:1.6em;position:relative}
.check li::before{content:"";position:absolute;left:0;top:.45em;width:.9em;height:.9em;border:2px solid var(--bamboo);border-radius:3px}
.due{margin-left:8px;font-size:.8rem;background:var(--chip);padding:1px 8px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wx{margin:12px 0 0;background:var(--chip);padding:8px 12px;font-size:.95rem}
.wxl{font-weight:700;color:var(--bamboo);margin-right:8px}
table.food td,table.food th{font-size:.92rem}
table.food{min-width:640px}
tr.grp td{background:var(--chip);font-family:var(--f-display);font-weight:600;color:var(--pepper)}
table.pk{background:transparent;margin-top:10px}
table.pk td{padding:6px 8px}
table.pk td:nth-child(2){font-weight:700;color:var(--pepper);white-space:nowrap}
table.pk td:nth-child(3){color:var(--muted);font-size:.9rem}
.foot{margin-top:40px;color:var(--muted);font-size:.9rem;text-align:center}
@media (max-width:480px){.hero h1{font-size:2.5rem}body{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <div class="lock" id="lock">
    <form class="lockbox" id="form">
      <div class="seal">成都</div>
      <label for="pw">請輸入密碼查看行程</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus>
      <button type="submit">打開行程</button>
      <p class="err" id="err" aria-live="polite"></p>
    </form>
  </div>
  <main id="app" hidden></main>
</div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.ct));
  return new TextDecoder().decode(pt);
}
function countdown(){
  const el=document.getElementById("count"); if(!el) return;
  const now=new Date(), dep=new Date("2026-11-10T00:00:00+08:00"), end=new Date("2026-11-15T00:00:00+08:00");
  const days=Math.ceil((dep-now)/86400000);
  el.textContent= now<dep ? `還有 ${days} 天出發` : now<end ? "旅途中，玩得開心" : "已經回到家了";
}
function show(html){
  document.getElementById("app").innerHTML=html;
  document.getElementById("lock").hidden=true;
  document.getElementById("app").hidden=false;
  countdown();
}
document.getElementById("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const pw=document.getElementById("pw").value.trim(), err=document.getElementById("err");
  err.textContent="解鎖中…";
  try{ const html=await unlock(pw); show(html); err.textContent="";
       try{sessionStorage.setItem("cdpw",pw)}catch(_){}
  }catch(_){ err.textContent="密碼不對，請再試一次（注意大小寫與減號）"; }
});
(async()=>{ try{const pw=sessionStorage.getItem("cdpw"); if(pw) show(await unlock(pw));}catch(_){} })();
</script>
