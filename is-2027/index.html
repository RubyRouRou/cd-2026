<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>冰島極光十六天</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one column read on a phone; day cards sit on a basalt-column band, each with its own daylight window */
:root{
  --bg:#eaeef1; --paper:#f8fafb; --ink:#16212b; --muted:#56636e;
  --jade:#1f5f86; --brass:#2f7d6a; --rose:#b34a3c; --line:#d0d8de; --chip:#dde4e9;
  --ice:#cfe6f2; --night:#1c2733; --aurora:#6fd3a6;
  --f-latin:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --paper:#151d25; --ink:#e4eaef; --muted:#97a6b2;
  --jade:#7cb9e0; --brass:#6cc7ac; --rose:#e8887a; --line:#283440; --chip:#1c2630;
  --ice:#173246; --night:#0a1016; --aurora:#7fe0b4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --paper:#151d25; --ink:#e4eaef; --muted:#97a6b2;
  --jade:#7cb9e0; --brass:#6cc7ac; --rose:#e8887a; --line:#283440; --chip:#1c2630;
  --ice:#173246; --night:#0a1016; --aurora:#7fe0b4; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.3;margin:0}
h2{font-size:1.5rem;color:var(--jade);margin-block:40px 14px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
h3{font-size:1.1rem}
h3.sub{margin-top:20px}
a{color:var(--jade)}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.lat{font-family:var(--f-latin);letter-spacing:.04em}

/* basalt column band (Reynisfjara) */
.basalt{height:34px;margin-bottom:18px;
  background:var(--ink);
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 9px,transparent 9px 11px);
          mask:repeating-linear-gradient(90deg,#000 0 9px,transparent 9px 11px);
  clip-path:polygon(0 40%,4% 20%,8% 55%,12% 10%,16% 35%,20% 0,24% 45%,28% 25%,32% 60%,36% 15%,40% 40%,44% 5%,48% 30%,52% 50%,56% 20%,60% 0,64% 35%,68% 55%,72% 15%,76% 30%,80% 5%,84% 45%,88% 25%,92% 60%,96% 20%,100% 35%,100% 100%,0 100%)}
[hidden]{display:none!important}
/* lock */
.lock{min-height:70vh;display:grid;place-items:center}
.lockbox{width:100%;max-width:380px;background:var(--paper);border:1px solid var(--line);padding:0 22px 26px;display:grid;gap:14px;text-align:center;box-sizing:border-box}
.lockbox .basalt{margin:18px 0 0}
.lockbox .seal{font-family:var(--f-display);font-size:2.3rem;color:var(--jade);font-weight:900;letter-spacing:.12em}
.lockbox label{font-size:1rem;color:var(--muted)}
.lockbox input{font-size:1.15rem;padding:12px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink);text-align:center;width:100%;box-sizing:border-box}
.lockbox button{font-size:1.05rem;padding:12px;border:0;border-radius:3px;background:var(--jade);color:var(--paper);font-weight:700;cursor:pointer}
.err{color:var(--rose);font-size:.95rem;min-height:1.4em;margin:0}

/* hero */
.hero{padding-block:8px 4px}
.eyebrow{margin:0;color:var(--muted);letter-spacing:.1em;font-size:.88rem}
.hero h1{font-size:3rem;font-weight:900;color:var(--ink)}
.hero h1 span{font-size:1.2rem;color:var(--jade);font-weight:600;margin-left:.5em}
.dates{margin:2px 0 0;font-size:1.15rem}
.dates .lat{font-size:1.5rem;color:var(--brass)}
.count{margin:4px 0 0;color:var(--jade);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;z-index:5}
.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}
.tabs a{white-space:nowrap;flex:none;text-decoration:none;color:var(--ink);background:var(--chip);padding:5px 13px;border-radius:999px;font-size:.92rem}
.tabs a:hover{background:var(--line)}

.rules{background:var(--paper);border:1px solid var(--line);padding:4px 18px 10px;margin-top:18px}
.rules h2{margin-block:14px 6px;font-size:1.2rem}
.rules h2::after{display:none}
.rules ul{margin:0;padding-left:1.2em}
.lede{margin:0 0 12px;color:var(--muted)}

/* day cards */
.day{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--jade);padding:16px 18px 18px;margin-bottom:16px}
.dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dnum{font-size:1.7rem;color:var(--jade)}
.dow{color:var(--muted)}
.slots{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.slots li{display:grid;grid-template-columns:3em 1fr;gap:10px}
.slots li>div{min-width:0}
.t{font-weight:700;color:var(--brass);font-size:.95rem}
.nav{display:inline-block;margin-left:8px;font-size:.8rem;font-weight:700;border:1px solid var(--jade);border-radius:999px;padding:0 10px;text-decoration:none;white-space:nowrap}
.why{margin:12px 0 0;color:var(--muted);font-size:.93rem}

.lat{font-family:var(--f-latin);letter-spacing:.06em;font-weight:500}
.dnum{font-weight:700}
.sun{margin-left:auto;font-size:.85rem;color:var(--muted);font-family:var(--f-latin);letter-spacing:.05em;white-space:nowrap}
.road{display:inline-block;margin-left:8px;font-size:.78rem;font-weight:700;color:var(--jade);border:1.5px solid var(--jade);border-radius:3px;padding:0 7px;white-space:nowrap}
.day.dark{background:var(--night);border-top-color:var(--aurora);color:#e4eaef}
.day.dark .dnum,.day.dark .t{color:var(--aurora)}
.day.dark .dow,.day.dark .sun,.day.dark .why{color:#a9b6c2}
.day.dark .dhead{border-bottom-color:#2c3a47}
.day.dark a,.day.dark .road{color:var(--aurora);border-color:var(--aurora)}
.day.ice{background:var(--ice)}
/* day photos */
.photos{display:grid;gap:8px;margin-top:12px}
.photos.n2{grid-template-columns:1fr 1fr}
.ph{margin:0;min-width:0;display:grid;gap:4px}
.ph img{display:block;width:100%;max-width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--chip);border-radius:2px}
.photos.n1 .ph img{aspect-ratio:16/9}
.ph figcaption{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:6px;min-width:0}
.ph figcaption a{font-size:.72rem;color:var(--muted);flex:none}
.day.dark .ph figcaption,.day.dark .ph figcaption a{color:#a9b6c2}
.slots li.rd .t{color:var(--rose)}
.slots li.rd div{font-size:.93rem;color:var(--muted)}
.day.dark .slots li.rd div{color:#a9b6c2}
.slots li.fu .t{color:var(--brass)}
.slots li.sh .t{color:#c2577a}
.slots li.sh div{font-size:.93rem}
.slots li.fu div{font-size:.93rem;color:var(--muted)}
.day.dark .slots li.fu div{color:#a9b6c2}
@media (max-width:560px){
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%;box-sizing:border-box}
  table.stack tr{border-bottom:1px solid var(--line);padding:10px 12px}
  table.stack td{border:0;padding:2px 0;display:grid;grid-template-columns:5.5em 1fr;gap:8px}
  table.stack td::before{content:attr(data-l);color:var(--muted);font-size:.85rem}
  table.stack td[data-l=""]{display:none}
}
.card.warnc{border-left:4px solid var(--rose)}
.card.warnc h3{color:var(--rose)}
/* spots */
.spots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.spot{background:var(--paper);border:1px solid var(--line);padding:14px 16px;min-width:0;display:grid;gap:6px;align-content:start}
.spot p{margin:0;font-size:.95rem}
.spot .tags{color:var(--rose);font-size:.85rem;letter-spacing:.05em}
.spot .nav{margin:0;justify-self:start}
.pin{justify-self:start;font-size:.75rem;padding:0 8px;border-radius:2px;background:var(--chip);color:var(--muted)}
.pin.on{background:var(--jade);color:var(--paper)}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--paper);font-size:.98rem}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500}
tr.sum td{font-weight:700;color:var(--jade)}
.note{color:var(--muted);font-size:.88rem;margin:8px 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.card{background:var(--paper);border:1px solid var(--line);padding:14px 16px;min-width:0}
.card p,.card ul{margin:8px 0 0}
.card ul{padding-left:1.1em}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.two>div{min-width:0}
.check{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.check li{padding-left:1.6em;position:relative}
.check li::before{content:"";position:absolute;left:0;top:.45em;width:.85em;height:.85em;border:2px solid var(--jade);border-radius:2px}
.due{margin-left:8px;font-size:.78rem;background:var(--chip);padding:1px 8px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
table.pk{background:transparent;margin-top:10px}
table.pk td{padding:6px 8px}
table.pk td:nth-child(2){font-weight:700;color:var(--brass);white-space:nowrap}
table.pk td:nth-child(3){color:var(--muted);font-size:.88rem}
.foot{margin-top:40px;color:var(--muted);font-size:.88rem;text-align:center}
@media (max-width:480px){.hero h1{font-size:2.4rem}body{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.bk{margin-top:.5em;padding:.45em .6em;border-left:3px solid #c98a2b;background:rgba(201,138,43,.08);border-radius:4px}</style>

<div class="wrap">
  <div class="lock" id="lock">
    <form class="lockbox" id="form">
      <div class="basalt" aria-hidden="true"></div>
      <div class="seal">冰島</div>
      <label for="pw">請輸入密碼查看行程</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus>
      <button type="submit">打開行程</button>
      <p class="err" id="err" aria-live="polite"></p>
    </form>
  </div>
  <main id="app" hidden></main>
</div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.ct));
  return new TextDecoder().decode(pt);
}
function countdown(){
  const el=document.getElementById("count"); if(!el) return;
  const now=new Date(), dep=new Date("2027-11-19T00:00:00+08:00"), end=new Date("2027-12-05T00:00:00+08:00");
  const days=Math.ceil((dep-now)/86400000);
  el.textContent= now<dep ? `還有 ${days} 天出發` : now<end ? "旅途中，玩得開心" : "已經回到家了";
}
function show(html){
  document.getElementById("app").innerHTML=html;
  document.querySelectorAll("#app .ph img").forEach(img=>{
    img.addEventListener("error",()=>{
      if(img.dataset.alt && img.src!==img.dataset.alt){ img.src=img.dataset.alt; }
      else { const f=img.closest(".ph"); if(f) f.hidden=true; }
    });
  });
  document.getElementById("lock").hidden=true;
  document.getElementById("app").hidden=false;
  countdown();
}
document.getElementById("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const pw=document.getElementById("pw").value.trim(), err=document.getElementById("err");
  err.textContent="解鎖中…";
  try{ const html=await unlock(pw); show(html); err.textContent="";
       try{sessionStorage.setItem("ispw",pw)}catch(_){}
  }catch(_){ err.textContent="密碼不對，請再試一次（注意大小寫與減號）"; }
});
(async()=>{ try{const pw=sessionStorage.getItem("ispw"); if(pw) show(await unlock(pw));}catch(_){} })();
</script>
